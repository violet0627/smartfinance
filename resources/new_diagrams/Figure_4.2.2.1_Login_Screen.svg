<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Arial, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="844" rx="40" ry="40" fill="#F5F5F5"/>

  <!-- Status bar -->
  <rect width="390" height="44" rx="0" fill="#1A1A2E"/>
  <rect width="390" height="44" rx="0" fill="#6C63FF"/>
  <text x="20" y="28" font-size="12" fill="white" font-weight="bold">9:41</text>
  <text x="340" y="28" font-size="11" fill="white">●●● 📶 🔋</text>

  <!-- Logo area -->
  <circle cx="195" cy="145" r="48" fill="#6C63FF"/>
  <text x="195" y="138" font-size="28" fill="white" text-anchor="middle">💰</text>
  <text x="195" y="160" font-size="11" fill="white" text-anchor="middle" font-weight="bold">SF</text>

  <text x="195" y="218" font-size="26" fill="#212121" text-anchor="middle" font-weight="bold">SmartFinance</text>
  <text x="195" y="244" font-size="14" fill="#757575" text-anchor="middle">Manage your money smartly</text>

  <!-- Email field -->
  <rect x="24" y="276" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="296" font-size="11" fill="#757575">Email Address</text>
  <text x="44" y="314" font-size="14" fill="#212121">user@example.com</text>
  <text x="340" y="306" font-size="16" fill="#BDBDBD" text-anchor="middle">✉</text>

  <!-- Password field -->
  <rect x="24" y="340" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="360" font-size="11" fill="#757575">Password</text>
  <text x="44" y="378" font-size="14" fill="#212121">••••••••</text>
  <text x="345" y="370" font-size="16" fill="#BDBDBD" text-anchor="end">👁</text>

  <!-- Forgot Password -->
  <text x="366" y="412" font-size="13" fill="#6C63FF" text-anchor="end">Forgot Password?</text>

  <!-- Sign In button -->
  <rect x="24" y="430" width="342" height="52" rx="14" fill="#6C63FF"/>
  <text x="195" y="462" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Sign In</text>

  <!-- Divider -->
  <line x1="24" y1="504" x2="170" y2="504" stroke="#E0E0E0" stroke-width="1"/>
  <text x="195" y="509" font-size="12" fill="#BDBDBD" text-anchor="middle">OR</text>
  <line x1="220" y1="504" x2="366" y2="504" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Register link -->
  <text x="195" y="546" font-size="14" fill="#757575" text-anchor="middle">Don't have an account?</text>
  <text x="195" y="568" font-size="14" fill="#6C63FF" text-anchor="middle" font-weight="bold">Create Account</text>

  <!-- Figure caption -->
  <text x="195" y="830" font-size="11" fill="#9E9E9E" text-anchor="middle">Figure 4.2.2.1 Login Screen</text>
</svg>
