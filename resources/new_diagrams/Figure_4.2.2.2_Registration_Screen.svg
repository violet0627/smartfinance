<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Arial, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="844" rx="40" ry="40" fill="#F5F5F5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#6C63FF"/>
  <text x="20" y="28" font-size="12" fill="white" font-weight="bold">9:41</text>
  <text x="340" y="28" font-size="11" fill="white">●●● 📶 🔋</text>

  <!-- App bar -->
  <rect x="0" y="44" width="390" height="56" fill="#6C63FF"/>
  <text x="48" y="78" font-size="18" fill="white" font-weight="bold">Create Account</text>
  <text x="24" y="78" font-size="20" fill="white">←</text>

  <!-- Full Name field -->
  <rect x="24" y="124" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="144" font-size="11" fill="#757575">Full Name</text>
  <text x="44" y="162" font-size="14" fill="#212121">e.g. Ahmad Faris</text>

  <!-- Email field -->
  <rect x="24" y="188" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="208" font-size="11" fill="#757575">Email Address</text>
  <text x="44" y="226" font-size="14" fill="#212121">e.g. ahmad@example.com</text>

  <!-- Phone field -->
  <rect x="24" y="252" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="272" font-size="11" fill="#757575">Phone Number (Optional)</text>
  <text x="44" y="290" font-size="14" fill="#BDBDBD">e.g. 012-3456789</text>

  <!-- Password field -->
  <rect x="24" y="316" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="336" font-size="11" fill="#757575">Password</text>
  <text x="44" y="354" font-size="14" fill="#212121">••••••••</text>
  <text x="345" y="346" font-size="16" fill="#BDBDBD" text-anchor="end">👁</text>

  <!-- Confirm Password field -->
  <rect x="24" y="380" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="400" font-size="11" fill="#757575">Confirm Password</text>
  <text x="44" y="418" font-size="14" fill="#212121">••••••••</text>
  <text x="345" y="410" font-size="16" fill="#BDBDBD" text-anchor="end">👁</text>

  <!-- Password strength indicator -->
  <text x="44" y="448" font-size="11" fill="#757575">Password Strength</text>
  <rect x="44" y="454" width="80" height="4" rx="2" fill="#10B981"/>
  <rect x="132" y="454" width="80" height="4" rx="2" fill="#10B981"/>
  <rect x="220" y="454" width="80" height="4" rx="2" fill="#E0E0E0"/>
  <text x="310" y="460" font-size="10" fill="#10B981">Medium</text>

  <!-- Create Account button -->
  <rect x="24" y="476" width="342" height="52" rx="14" fill="#6C63FF"/>
  <text x="195" y="508" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Create Account</text>

  <!-- Terms note -->
  <text x="195" y="548" font-size="11" fill="#BDBDBD" text-anchor="middle">By registering, you agree to our</text>
  <text x="195" y="564" font-size="11" fill="#6C63FF" text-anchor="middle">Terms of Service and Privacy Policy</text>

  <!-- Sign in link -->
  <text x="195" y="596" font-size="14" fill="#757575" text-anchor="middle">Already have an account?</text>
  <text x="195" y="616" font-size="14" fill="#6C63FF" text-anchor="middle" font-weight="bold">Sign In</text>

  <!-- Figure caption -->
  <text x="195" y="830" font-size="11" fill="#9E9E9E" text-anchor="middle">Figure 4.2.2.2 Registration Screen</text>
</svg>
