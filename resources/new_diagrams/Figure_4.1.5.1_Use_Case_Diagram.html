<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figure 4.1.5.1 — SmartFinance System Use Case Diagram</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: white; }
    h2   { color: #6C63FF; font-size: 15px; text-align: center; margin-bottom: 14px; }
  </style>
</head>
<body>
  <h2>Figure 4.1.5.1 — SmartFinance System Use Case Diagram</h2>

  <svg width="1100" height="590"
       xmlns="http://www.w3.org/2000/svg"
       font-family="Arial, sans-serif">

    <!-- ══════════════════════════════════════════
         SYSTEM BOUNDARY
    ══════════════════════════════════════════ -->
    <rect x="178" y="28" width="820" height="540"
          rx="10" fill="#F9FAFB" stroke="#6C63FF" stroke-width="2.5"/>
    <text x="588" y="50" text-anchor="middle"
          font-size="13" font-weight="bold" fill="#6C63FF">
      SmartFinance System
    </text>

    <!-- ══════════════════════════════════════════
         ROW 1 — Authentication | Transactions | Budget | Investments
    ══════════════════════════════════════════ -->

    <!-- Authentication -->
    <rect x="186" y="60" width="188" height="135"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="280" y="75" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Authentication</text>
    <ellipse cx="280" cy="94"  rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="97"  text-anchor="middle" font-size="9" fill="#111827">Register Account</text>
    <ellipse cx="280" cy="118" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="121" text-anchor="middle" font-size="9" fill="#111827">Login</text>
    <ellipse cx="280" cy="142" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="145" text-anchor="middle" font-size="9" fill="#111827">Enable Two-Factor Auth</text>
    <ellipse cx="280" cy="166" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="169" text-anchor="middle" font-size="9" fill="#111827">Reset Password via Email</text>

    <!-- Transactions -->
    <rect x="382" y="60" width="188" height="110"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="476" y="75" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Transactions</text>
    <ellipse cx="476" cy="94"  rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="476" y="97"  text-anchor="middle" font-size="9" fill="#111827">Add Transaction</text>
    <ellipse cx="476" cy="118" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="476" y="121" text-anchor="middle" font-size="9" fill="#111827">View Transaction History</text>
    <ellipse cx="476" cy="142" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="476" y="145" text-anchor="middle" font-size="9" fill="#111827">Scan Receipt</text>

    <!-- Budget -->
    <rect x="578" y="60" width="185" height="87"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="670" y="75" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Budget</text>
    <ellipse cx="670" cy="94"  rx="80" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="670" y="97"  text-anchor="middle" font-size="9" fill="#111827">Set Monthly Budget</text>
    <ellipse cx="670" cy="118" rx="80" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="670" y="121" text-anchor="middle" font-size="9" fill="#111827">View Budget Status</text>

    <!-- Investment Tracking -->
    <rect x="771" y="60" width="219" height="87"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="880" y="75" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Investment Tracking</text>
    <ellipse cx="880" cy="94"  rx="95" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="880" y="97"  text-anchor="middle" font-size="9" fill="#111827">Add Investment Entry</text>
    <ellipse cx="880" cy="118" rx="95" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="880" y="121" text-anchor="middle" font-size="9" fill="#111827">View Portfolio Performance</text>

    <!-- ══════════════════════════════════════════
         ROW 2 — Goals | Insights | Gamification | Settings
    ══════════════════════════════════════════ -->

    <!-- Savings Goals -->
    <rect x="186" y="214" width="188" height="87"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="280" y="229" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Savings Goals</text>
    <ellipse cx="280" cy="248" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="251" text-anchor="middle" font-size="9" fill="#111827">Create Savings Goal</text>
    <ellipse cx="280" cy="272" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="275" text-anchor="middle" font-size="9" fill="#111827">View Goal Progress</text>

    <!-- Financial Insights -->
    <rect x="382" y="214" width="188" height="87"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="476" y="229" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Financial Insights</text>
    <ellipse cx="476" cy="248" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="476" y="251" text-anchor="middle" font-size="9" fill="#111827">View Financial Health Score</text>
    <ellipse cx="476" cy="272" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="476" y="275" text-anchor="middle" font-size="9" fill="#111827">View Insight Cards</text>

    <!-- Gamification -->
    <rect x="578" y="214" width="185" height="110"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="670" y="229" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Gamification</text>
    <ellipse cx="670" cy="248" rx="80" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="670" y="251" text-anchor="middle" font-size="9" fill="#111827">View XP and Level</text>
    <ellipse cx="670" cy="272" rx="80" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="670" y="275" text-anchor="middle" font-size="9" fill="#111827">View Achievements</text>
    <ellipse cx="670" cy="296" rx="80" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="670" y="299" text-anchor="middle" font-size="9" fill="#111827">View Habit Streak</text>

    <!-- Profile and Settings -->
    <rect x="771" y="214" width="219" height="110"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="880" y="229" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Profile and Settings</text>
    <ellipse cx="880" cy="248" rx="95" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="880" y="251" text-anchor="middle" font-size="9" fill="#111827">Manage Profile and Avatar</text>
    <ellipse cx="880" cy="272" rx="95" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="880" y="275" text-anchor="middle" font-size="9" fill="#111827">Notification Settings</text>
    <ellipse cx="880" cy="296" rx="95" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="880" y="299" text-anchor="middle" font-size="9" fill="#111827">Manage Active Sessions</text>

    <!-- ══════════════════════════════════════════
         ROW 3 — Recurring | Automated Processes
    ══════════════════════════════════════════ -->

    <!-- Recurring Transactions -->
    <rect x="186" y="342" width="188" height="87"
          rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="280" y="357" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#5B21B6">Recurring Transactions</text>
    <ellipse cx="280" cy="376" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="379" text-anchor="middle" font-size="9" fill="#111827">Set Recurring Transaction</text>
    <ellipse cx="280" cy="400" rx="82" ry="12" fill="white" stroke="#7C3AED" stroke-width="1"/>
    <text    x="280" y="403" text-anchor="middle" font-size="9" fill="#111827">Toggle or Delete Rule</text>

    <!-- Automated Processes (blue — System actor) -->
    <rect x="382" y="342" width="608" height="110"
          rx="5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="686" y="357" text-anchor="middle"
          font-size="10" font-weight="bold" font-style="italic" fill="#1D4ED8">
      Automated Processes (System-Initiated)
    </text>
    <!-- 4 ellipses in 2×2 grid -->
    <ellipse cx="492" cy="378" rx="102" ry="12" fill="white" stroke="#3B82F6" stroke-width="1"/>
    <text    x="492" y="381" text-anchor="middle" font-size="9" fill="#111827">Send Budget Alert Notification</text>
    <ellipse cx="878" cy="378" rx="102" ry="12" fill="white" stroke="#3B82F6" stroke-width="1"/>
    <text    x="878" y="381" text-anchor="middle" font-size="9" fill="#111827">Evaluate Achievement Criteria</text>
    <ellipse cx="492" cy="408" rx="102" ry="12" fill="white" stroke="#3B82F6" stroke-width="1"/>
    <text    x="492" y="411" text-anchor="middle" font-size="9" fill="#111827">Execute Recurring Transaction</text>
    <ellipse cx="878" cy="408" rx="102" ry="12" fill="white" stroke="#3B82F6" stroke-width="1"/>
    <text    x="878" y="411" text-anchor="middle" font-size="9" fill="#111827">Calculate Financial Health Score</text>

    <!-- ══════════════════════════════════════════
         LEGEND
    ══════════════════════════════════════════ -->
    <text x="186" y="480" font-size="9" fill="#6B7280" font-style="italic">
      Note: Registered User inherits Login access. Guest access is restricted to Authentication use cases only.
    </text>

    <!-- ══════════════════════════════════════════
         ACTOR BOXES  (outside system boundary)
    ══════════════════════════════════════════ -->

    <!-- Guest (left, upper) -->
    <rect x="22" y="92" width="132" height="42" rx="6"
          fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="88" y="118" text-anchor="middle"
          font-size="12" font-weight="bold" fill="#92400E">Guest</text>

    <!-- Registered User (left, lower) -->
    <rect x="12" y="272" width="150" height="42" rx="6"
          fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="87" y="298" text-anchor="middle"
          font-size="12" font-weight="bold" fill="#065F46">Registered User</text>

    <!-- System actor (right, beside automated) -->
    <rect x="1003" y="382" width="85" height="42" rx="6"
          fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="1045" y="408" text-anchor="middle"
          font-size="12" font-weight="bold" fill="#1E40AF">System</text>

    <!-- ══════════════════════════════════════════
         CONNECTION LINES
    ══════════════════════════════════════════ -->

    <!-- Guest → Authentication (upper) -->
    <line x1="154" y1="110" x2="186" y2="100"
          stroke="#B45309" stroke-width="1.3"/>

    <!-- Registered User → Authentication (lower entry — Login) -->
    <line x1="162" y1="290" x2="186" y2="165"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Transactions -->
    <line x1="162" y1="290" x2="382" y2="118"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Budget -->
    <line x1="162" y1="290" x2="578" y2="104"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Investments -->
    <line x1="162" y1="290" x2="771" y2="104"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Goals -->
    <line x1="162" y1="290" x2="186" y2="260"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Financial Insights -->
    <line x1="162" y1="290" x2="382" y2="260"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Gamification -->
    <line x1="162" y1="290" x2="578" y2="272"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Settings -->
    <line x1="162" y1="290" x2="771" y2="272"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- Registered User → Recurring -->
    <line x1="162" y1="290" x2="186" y2="376"
          stroke="#059669" stroke-width="1.2" stroke-dasharray="3,2"/>

    <!-- System → Automated Processes -->
    <line x1="1003" y1="403" x2="990" y2="403"
          stroke="#1D4ED8" stroke-width="1.5"/>

  </svg>
</body>
</html>
