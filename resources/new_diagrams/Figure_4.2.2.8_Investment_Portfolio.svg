<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Arial, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="844" rx="40" ry="40" fill="#F5F5F5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#6C63FF"/>
  <text x="20" y="28" font-size="12" fill="white" font-weight="bold">9:41</text>
  <text x="340" y="28" font-size="11" fill="white">●●● 📶 🔋</text>

  <!-- App bar -->
  <rect x="0" y="44" width="390" height="56" fill="#6C63FF"/>
  <text x="195" y="78" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Investment Portfolio</text>

  <!-- Portfolio summary card -->
  <rect x="16" y="116" width="358" height="110" rx="16" fill="#6C63FF"/>
  <!-- Total invested -->
  <text x="195" y="142" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Total Portfolio Value</text>
  <text x="195" y="170" font-size="28" fill="white" text-anchor="middle" font-weight="bold">RM 28,540.00</text>
  <!-- Stats row -->
  <text x="80" y="196" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Invested</text>
  <text x="80" y="212" font-size="13" fill="white" text-anchor="middle" font-weight="bold">RM 25,000</text>
  <line x1="160" y1="196" x2="160" y2="216" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="230" y="196" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Gain/Loss</text>
  <text x="230" y="212" font-size="13" fill="#A5F3C8" text-anchor="middle" font-weight="bold">+RM 3,540 (+14.16%)</text>

  <!-- Holdings header -->
  <text x="16" y="250" font-size="14" fill="#212121" font-weight="bold">Holdings (4)</text>

  <!-- Holding 1: Stocks -->
  <rect x="16" y="260" width="358" height="76" rx="12" fill="white"/>
  <rect x="30" y="278" width="36" height="36" rx="8" fill="#E3F2FD"/>
  <text x="48" y="301" font-size="22" text-anchor="middle">📈</text>
  <text x="80" y="279" font-size="14" fill="#212121" font-weight="bold">Apple Inc.</text>
  <text x="80" y="297" font-size="12" fill="#757575">Stocks  •  AAPL</text>
  <text x="80" y="313" font-size="11" fill="#BDBDBD">10 units @ RM 785.00</text>
  <text x="360" y="279" font-size="14" fill="#212121" text-anchor="end" font-weight="bold">RM 8,250</text>
  <text x="360" y="297" font-size="12" fill="#10B981" text-anchor="end" font-weight="bold">+RM 600 (↑7.85%)</text>
  <rect x="316" y="307" width="44" height="18" rx="4" fill="#E8F5E9"/>
  <text x="338" y="320" font-size="10" fill="#10B981" text-anchor="middle">PROFIT</text>

  <!-- Holding 2: Crypto -->
  <rect x="16" y="344" width="358" height="76" rx="12" fill="white"/>
  <rect x="30" y="362" width="36" height="36" rx="8" fill="#FFF8E1"/>
  <text x="48" y="385" font-size="22" text-anchor="middle">₿</text>
  <text x="80" y="363" font-size="14" fill="#212121" font-weight="bold">Bitcoin</text>
  <text x="80" y="381" font-size="12" fill="#757575">Cryptocurrency  •  BTC</text>
  <text x="80" y="397" font-size="11" fill="#BDBDBD">0.15 units @ RM 52,000</text>
  <text x="360" y="363" font-size="14" fill="#212121" text-anchor="end" font-weight="bold">RM 12,450</text>
  <text x="360" y="381" font-size="12" fill="#10B981" text-anchor="end" font-weight="bold">+RM 2,550 (↑25.8%)</text>
  <rect x="316" y="391" width="44" height="18" rx="4" fill="#E8F5E9"/>
  <text x="338" y="404" font-size="10" fill="#10B981" text-anchor="middle">PROFIT</text>

  <!-- Holding 3: ETF -->
  <rect x="16" y="428" width="358" height="76" rx="12" fill="white"/>
  <rect x="30" y="446" width="36" height="36" rx="8" fill="#E8F5E9"/>
  <text x="48" y="469" font-size="22" text-anchor="middle">📊</text>
