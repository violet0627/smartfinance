  <text x="360" y="447" font-size="14" fill="#212121" text-anchor="end" font-weight="bold">RM 5,840</text>
  <text x="360" y="465" font-size="12" fill="#EF4444" text-anchor="end" font-weight="bold">-RM 160 (↓2.67%)</text>
  <rect x="324" y="475" width="36" height="18" rx="4" fill="#FEE2E2"/>
  <text x="342" y="488" font-size="10" fill="#EF4444" text-anchor="middle">LOSS</text>

  <!-- Holding 4: Fixed Deposit -->
  <rect x="16" y="512" width="358" height="76" rx="12" fill="white"/>
  <rect x="30" y="530" width="36" height="36" rx="8" fill="#F3E5F5"/>
  <text x="48" y="553" font-size="22" text-anchor="middle">🏦</text>
  <text x="80" y="531" font-size="14" fill="#212121" font-weight="bold">Maybank FD</text>
  <text x="80" y="549" font-size="12" fill="#757575">Fixed Deposit</text>
  <text x="80" y="565" font-size="11" fill="#BDBDBD">1 unit @ RM 2,000.00</text>
  <text x="360" y="531" font-size="14" fill="#212121" text-anchor="end" font-weight="bold">RM 2,000</text>
  <text x="360" y="549" font-size="12" fill="#10B981" text-anchor="end" font-weight="bold">+RM 550 (↑27.5%)</text>
  <rect x="316" y="559" width="44" height="18" rx="4" fill="#E8F5E9"/>
  <text x="338" y="572" font-size="10" fill="#10B981" text-anchor="middle">PROFIT</text>

  <!-- FAB -->
  <circle cx="345" cy="660" r="28" fill="#6C63FF"/>
  <text x="345" y="667" font-size="22" fill="white" text-anchor="middle">+</text>

  <!-- Bottom nav bar -->
  <rect x="0" y="762" width="390" height="70" fill="white" stroke="#F0F0F0" stroke-width="1"/>
  <text x="40" y="800" font-size="20" text-anchor="middle">🏠</text>
  <text x="110" y="800" font-size="20" text-anchor="middle">📊</text>
  <text x="195" y="800" font-size="20" text-anchor="middle">📋</text>
  <text x="280" y="800" font-size="20" text-anchor="middle">🎯</text>
  <text x="350" y="800" font-size="20" text-anchor="middle">⚙️</text>

  <!-- Figure caption -->
  <text x="195" y="838" font-size="11" fill="#9E9E9E" text-anchor="middle">Figure 4.2.2.8 Investment Portfolio Screen</text>
