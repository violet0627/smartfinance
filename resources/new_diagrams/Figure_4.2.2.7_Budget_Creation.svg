<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Arial, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="844" rx="40" ry="40" fill="#F5F5F5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#6C63FF"/>
  <text x="20" y="28" font-size="12" fill="white" font-weight="bold">9:41</text>
  <text x="340" y="28" font-size="11" fill="white">●●● 📶 🔋</text>

  <!-- App bar -->
  <rect x="0" y="44" width="390" height="56" fill="#6C63FF"/>
  <text x="24" y="78" font-size="20" fill="white">←</text>
  <text x="195" y="78" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Create Budget</text>

  <!-- Month selector -->
  <text x="24" y="128" font-size="13" fill="#757575">Budget Month</text>
  <rect x="24" y="136" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="156" font-size="11" fill="#757575">Month / Year</text>
  <text x="44" y="174" font-size="14" fill="#212121">April 2026</text>
  <text x="345" y="166" font-size="16" fill="#6C63FF" text-anchor="end">📅</text>

  <!-- Total budget amount -->
  <text x="24" y="212" font-size="13" fill="#757575">Total Budget</text>
  <rect x="24" y="220" width="342" height="52" rx="10" fill="white" stroke="#6C63FF" stroke-width="2"/>
  <text x="44" y="240" font-size="11" fill="#757575">Total Amount (RM)</text>
  <text x="44" y="258" font-size="16" fill="#212121" font-weight="bold">3,000.00</text>

  <!-- Remaining indicator -->
  <rect x="24" y="284" width="342" height="36" rx="10" fill="#E8F5E9"/>
  <text x="195" y="307" font-size="13" fill="#10B981" text-anchor="middle" font-weight="bold">✓  Unallocated Remaining: RM 900.00</text>

  <!-- Category allocations header -->
  <text x="24" y="342" font-size="14" fill="#212121" font-weight="bold">Category Allocations</text>

  <!-- Food row -->
  <rect x="24" y="352" width="342" height="46" rx="10" fill="white"/>
  <circle cx="48" cy="375" r="14" fill="#FFF3E0"/>
  <text x="48" y="381" font-size="12" text-anchor="middle">🍔</text>
  <text x="72" y="379" font-size="13" fill="#212121">Food &amp; Dining</text>
  <rect x="244" y="360" width="110" height="30" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="264" y="380" font-size="13" fill="#212121">800</text>

  <!-- Transport row -->
  <rect x="24" y="406" width="342" height="46" rx="10" fill="white"/>
  <circle cx="48" cy="429" r="14" fill="#E3F2FD"/>
  <text x="48" y="435" font-size="12" text-anchor="middle">🚗</text>
  <text x="72" y="433" font-size="13" fill="#212121">Transport</text>
  <rect x="244" y="414" width="110" height="30" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="264" y="434" font-size="13" fill="#212121">400</text>

  <!-- Bills row -->
  <rect x="24" y="460" width="342" height="46" rx="10" fill="white"/>
  <circle cx="48" cy="483" r="14" fill="#E8F5E9"/>
  <text x="48" y="489" font-size="12" text-anchor="middle">💡</text>
  <text x="72" y="487" font-size="13" fill="#212121">Bills &amp; Utilities</text>
  <rect x="244" y="468" width="110" height="30" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="264" y="488" font-size="13" fill="#212121">600</text>

  <!-- Entertainment row -->
  <rect x="24" y="514" width="342" height="46" rx="10" fill="white"/>
  <circle cx="48" cy="537" r="14" fill="#FCE4EC"/>
  <text x="48" y="543" font-size="12" text-anchor="middle">🎮</text>
  <text x="72" y="541" font-size="13" fill="#212121">Entertainment</text>
  <rect x="244" y="522" width="110" height="30" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="264" y="542" font-size="13" fill="#212121">300</text>

  <!-- Shopping row -->
  <rect x="24" y="568" width="342" height="46" rx="10" fill="white"/>
  <circle cx="48" cy="591" r="14" fill="#F3E5F5"/>
  <text x="48" y="597" font-size="12" text-anchor="middle">🛍️</text>
  <text x="72" y="595" font-size="13" fill="#212121">Shopping</text>
  <rect x="244" y="576" width="110" height="30" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="264" y="596" font-size="13" fill="#212121">500</text>

  <!-- Others row -->
  <rect x="24" y="622" width="342" height="46" rx="10" fill="white"/>
  <circle cx="48" cy="645" r="14" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <text x="48" y="651" font-size="12" text-anchor="middle">📁</text>
  <text x="72" y="649" font-size="13" fill="#212121">Others</text>
  <rect x="244" y="630" width="110" height="30" rx="8" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="264" y="650" font-size="13" fill="#BDBDBD">0</text>

  <!-- Create Budget button -->
  <rect x="24" y="686" width="342" height="52" rx="14" fill="#6C63FF"/>
  <text x="195" y="718" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Create Budget</text>

  <!-- Figure caption -->
  <text x="195" y="830" font-size="11" fill="#9E9E9E" text-anchor="middle">Figure 4.2.2.7 Budget Creation</text>
</svg>
