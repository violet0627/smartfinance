<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Arial, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="844" rx="40" ry="40" fill="#F5F5F5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#6C63FF"/>
  <text x="20" y="28" font-size="12" fill="white" font-weight="bold">9:41</text>
  <text x="340" y="28" font-size="11" fill="white">●●● 📶 🔋</text>

  <!-- App bar -->
  <rect x="0" y="44" width="390" height="56" fill="#6C63FF"/>
  <text x="24" y="78" font-size="20" fill="white">←</text>
  <text x="195" y="78" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Add Investment</text>

  <!-- Asset type header -->
  <text x="24" y="124" font-size="14" fill="#212121" font-weight="bold">Select Asset Type</text>
  <text x="24" y="142" font-size="12" fill="#757575">Choose the type that best matches your investment</text>

  <!-- Asset type grid (5 columns x 2 rows) -->
  <!-- Row 1 -->
  <rect x="16" y="152" width="66" height="64" rx="12" fill="#6C63FF"/>
  <text x="49" y="177" font-size="22" text-anchor="middle">📈</text>
  <text x="49" y="200" font-size="10" fill="white" text-anchor="middle" font-weight="bold">Stocks</text>

  <rect x="90" y="152" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="123" y="177" font-size="22" text-anchor="middle">₿</text>
  <text x="123" y="200" font-size="9" fill="#212121" text-anchor="middle">Crypto</text>

  <rect x="164" y="152" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="197" y="177" font-size="22" text-anchor="middle">📊</text>
  <text x="197" y="200" font-size="9" fill="#212121" text-anchor="middle">ETF</text>

  <rect x="238" y="152" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="271" y="177" font-size="22" text-anchor="middle">📜</text>
  <text x="271" y="200" font-size="9" fill="#212121" text-anchor="middle">Bonds</text>

  <rect x="312" y="152" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="345" y="177" font-size="22" text-anchor="middle">🏠</text>
  <text x="345" y="200" font-size="9" fill="#212121" text-anchor="middle">Real Estate</text>

  <!-- Row 2 -->
  <rect x="16" y="224" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="49" y="249" font-size="22" text-anchor="middle">🥇</text>
  <text x="49" y="272" font-size="9" fill="#212121" text-anchor="middle">Commodities</text>

  <rect x="90" y="224" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="123" y="249" font-size="22" text-anchor="middle">🏦</text>
  <text x="123" y="272" font-size="9" fill="#212121" text-anchor="middle">Fixed Deposit</text>

  <rect x="164" y="224" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="197" y="249" font-size="22" text-anchor="middle">💼</text>
  <text x="197" y="272" font-size="9" fill="#212121" text-anchor="middle">Unit Trust</text>

  <rect x="238" y="224" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="271" y="249" font-size="22" text-anchor="middle">📉</text>
  <text x="271" y="272" font-size="9" fill="#212121" text-anchor="middle">Options</text>

  <rect x="312" y="224" width="66" height="64" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="345" y="249" font-size="22" text-anchor="middle">📁</text>
  <text x="345" y="272" font-size="9" fill="#212121" text-anchor="middle">Others</text>

  <!-- Form fields (shown after type selected) -->
  <text x="24" y="316" font-size="13" fill="#757575">Investment Details</text>

  <!-- Asset Name -->
  <rect x="24" y="324" width="342" height="52" rx="10" fill="white" stroke="#6C63FF" stroke-width="2"/>
  <text x="44" y="344" font-size="11" fill="#757575">Asset Name *</text>
  <text x="44" y="362" font-size="14" fill="#212121">Apple Inc.</text>

  <!-- Stock Symbol -->
  <rect x="24" y="388" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="408" font-size="11" fill="#757575">Stock Symbol (Optional)</text>
  <text x="44" y="426" font-size="14" fill="#212121">AAPL</text>

  <!-- Quantity + Purchase Price row -->
  <rect x="24" y="452" width="162" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="472" font-size="11" fill="#757575">Quantity</text>
  <text x="44" y="490" font-size="14" fill="#212121">10</text>

  <rect x="204" y="452" width="162" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="224" y="472" font-size="11" fill="#757575">Purchase Price (RM)</text>
  <text x="224" y="490" font-size="14" fill="#212121">765.00</text>

  <!-- Total auto-calculated -->
  <rect x="24" y="516" width="342" height="36" rx="10" fill="#E8F5E9"/>
  <text x="44" y="539" font-size="12" fill="#10B981">Total: RM 7,650.00  (Quantity × Price)</text>

  <!-- Purchase Date -->
  <rect x="24" y="564" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="584" font-size="11" fill="#757575">Purchase Date</text>
  <text x="44" y="602" font-size="14" fill="#212121">1 Jan 2026</text>
  <text x="345" y="596" font-size="16" fill="#6C63FF" text-anchor="end">📅</text>

  <!-- Notes -->
  <rect x="24" y="628" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="648" font-size="11" fill="#757575">Notes (Optional)</text>
  <text x="44" y="666" font-size="14" fill="#BDBDBD">e.g. Long-term hold</text>

  <!-- Save button -->
  <rect x="24" y="696" width="342" height="52" rx="14" fill="#6C63FF"/>
  <text x="195" y="728" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Save Investment</text>

  <!-- Figure caption -->
  <text x="195" y="830" font-size="11" fill="#9E9E9E" text-anchor="middle">Figure 4.2.2.9 Investment Entry Form</text>
</svg>
