<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Arial, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="844" rx="40" ry="40" fill="#F5F5F5"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#6C63FF"/>
  <text x="20" y="28" font-size="12" fill="white" font-weight="bold">9:41</text>
  <text x="340" y="28" font-size="11" fill="white">●●● 📶 🔋</text>

  <!-- App bar -->
  <rect x="0" y="44" width="390" height="56" fill="#6C63FF"/>
  <text x="24" y="78" font-size="20" fill="white">✕</text>
  <text x="195" y="78" font-size="18" fill="white" font-weight="bold" text-anchor="middle">Add Transaction</text>

  <!-- Amount display card -->
  <rect x="24" y="120" width="342" height="80" rx="16" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="195" y="150" font-size="12" fill="#757575" text-anchor="middle">Amount (RM)</text>
  <text x="195" y="182" font-size="32" fill="#212121" text-anchor="middle" font-weight="bold">RM 0.00</text>

  <!-- Type toggle -->
  <rect x="24" y="218" width="342" height="44" rx="12" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <rect x="28" y="222" width="165" height="36" rx="10" fill="#EF4444"/>
  <text x="110" y="245" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Expense</text>
  <text x="278" y="245" font-size="14" fill="#757575" text-anchor="middle" font-weight="bold">Income</text>

  <!-- Description field -->
  <rect x="24" y="276" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="296" font-size="11" fill="#757575">Description</text>
  <text x="44" y="314" font-size="14" fill="#BDBDBD">e.g. Lunch at mamak</text>

  <!-- Category section -->
  <text x="24" y="352" font-size="13" fill="#212121" font-weight="bold">Category</text>

  <!-- Category grid row 1 -->
  <rect x="24" y="362" width="70" height="70" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="59" y="392" font-size="22" text-anchor="middle">🍔</text>
  <text x="59" y="412" font-size="10" fill="#212121" text-anchor="middle">Food</text>

  <rect x="104" y="362" width="70" height="70" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="139" y="392" font-size="22" text-anchor="middle">🚗</text>
  <text x="139" y="412" font-size="10" fill="#212121" text-anchor="middle">Transport</text>

  <rect x="184" y="362" width="70" height="70" rx="12" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <text x="219" y="392" font-size="22" text-anchor="middle">🛍️</text>
  <text x="219" y="412" font-size="10" fill="#212121" text-anchor="middle">Shopping</text>

  <rect x="264" y="362" width="70" height="70" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="299" y="392" font-size="22" text-anchor="middle">💡</text>
  <text x="299" y="412" font-size="10" fill="#212121" text-anchor="middle">Bills</text>

  <!-- Category grid row 2 -->
  <rect x="24" y="444" width="70" height="70" rx="12" fill="#FCE4EC" stroke="#E91E63" stroke-width="1"/>
  <text x="59" y="474" font-size="22" text-anchor="middle">🎮</text>
  <text x="59" y="494" font-size="10" fill="#212121" text-anchor="middle">Entertainment</text>

  <rect x="104" y="444" width="70" height="70" rx="12" fill="#E0F7FA" stroke="#00BCD4" stroke-width="1"/>
  <text x="139" y="474" font-size="22" text-anchor="middle">💊</text>
  <text x="139" y="494" font-size="10" fill="#212121" text-anchor="middle">Health</text>

  <rect x="184" y="444" width="70" height="70" rx="12" fill="#FFF8E1" stroke="#FFC107" stroke-width="1"/>
  <text x="219" y="474" font-size="22" text-anchor="middle">📚</text>
  <text x="219" y="494" font-size="10" fill="#212121" text-anchor="middle">Education</text>

  <rect x="264" y="444" width="70" height="70" rx="12" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1"/>
  <text x="299" y="474" font-size="22" text-anchor="middle">📁</text>
  <text x="299" y="494" font-size="10" fill="#212121" text-anchor="middle">Others</text>

  <!-- Date field -->
  <rect x="24" y="532" width="342" height="52" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="44" y="552" font-size="11" fill="#757575">Date</text>
  <text x="44" y="570" font-size="14" fill="#212121">Today, 13 Apr 2026</text>
  <text x="345" y="562" font-size="16" fill="#6C63FF" text-anchor="end">📅</text>

  <!-- Save button -->
  <rect x="24" y="602" width="342" height="52" rx="14" fill="#EF4444"/>
  <text x="195" y="634" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Save Transaction</text>

  <!-- Figure caption -->
  <text x="195" y="830" font-size="11" fill="#9E9E9E" text-anchor="middle">Figure 4.2.2.4 Add Transaction Screen</text>
</svg>
