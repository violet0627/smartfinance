# backend-tests.yml — GitHub Actions CI workflow
#
# WHAT THIS DOES:
# Every time you push code or open a pull request, GitHub automatically:
# 1. Spins up a Ubuntu virtual machine
# 2. Installs Python and your dependencies
# 3. Runs all your pytest tests
# 4. Shows a green tick (pass) or red cross (fail) on the commit/PR
#
# This is called Continuous Integration (CI) — it catches bugs before they reach main.

name: Backend Tests   # Name shown in GitHub Actions tab

# --- When to run ---
on:
  push:
    branches: [ main, version2, commented-code ]   # Run on push to these branches
    paths:
      - 'backend/**'        # Only run when backend files change (saves CI minutes)
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main ]      # Always run on PRs targeting main

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest   # Use GitHub's Ubuntu runner (free for public repos)

    steps:
      # Step 1: Check out your code so the runner can access it
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 (matches our Dockerfile)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'    # Cache pip downloads — speeds up subsequent runs

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-flask

      # Step 4: Run the tests
      # -v = verbose (show each test name)
      # --tb=short = short traceback on failures (easier to read)
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          # Use SQLite in CI — no MySQL server needed.
          # The 'testing' config in config.py reads FLASK_ENV=testing and uses SQLite.
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key
